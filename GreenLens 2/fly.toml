# fly.toml app configuration file generated for greenlensai-rtqiyq
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "greenlensai-rtqiyq"
primary_region = "cdg"

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8000'
  HOST = '0.0.0.0'

[http_service]
auto_start_machines = true
auto_stop_machines = true
force_https = true
internal_port = 8000
min_machines_running = 0
processes = [ "app" ]

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  grace_period = '15s'
  interval = '30s'
  method = 'GET'
  timeout = '5s'
  path = '/api/health'

[[vm]]
cpu_kind = "shared"
cpus = 1
memory = "1gb"
memory_mb = 1024
